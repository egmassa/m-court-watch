# 三鷹テニスコート 空き監視の設定
# 設定ページ(index.html)から保存されました。ここを直接書き換えてもOKです。

# 監視する施設(room_id はコートチェッカーと同じ番号)
facilities:
  - name: "大沢総合グラウンド"
    room_id: 24
    exclude_courts: [6]   # 監視しないコート番号

# 監視する曜日(月 火 水 木 金 土 日)
weekdays: [月, 火, 水, 木, 金]

# 祝日を除くか(true=除く)
exclude_holidays: true

# この時刻以降に始まる枠だけ通知
time_from: "18:00"

# 今日から何日先まで見るか
days_ahead: 30

# この日より前は無視(不要なら空欄) 例: "2026-11-15"
date_from: ""
