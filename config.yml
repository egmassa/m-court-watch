# Ver 3.12
# テニスコート 空き監視の設定
# 設定ページ(index.html)から保存されました。ここを直接書き換えてもOKです。
# 通知しない近い日: 各施設の notify_min_days(今日から何日後以降の空きだけLINEに送る)。
#   書いていない施設は 1(当日は通知しない)。中学校は 3。0 にすると当日も通知する。

# ===== 三鷹市 =====
mitaka:
  enabled: true
  # 監視する施設(room_id はコートチェッカーと同じ番号)
  facilities:
    - name: "第一中学校"
      room_id: 134
      notify_min_days: 3    # 予約は3日後から。これより近い日の空きはLINEに送らない
    - name: "第四中学校"
      room_id: 141          # テニスコート(予約サイトの施設39・部屋141)
      notify_min_days: 3    # 予約は3日後から。これより近い日の空きはLINEに送らない
    - name: "第六中学校"
      room_id: 144
      notify_min_days: 3    # 予約は3日後から。これより近い日の空きはLINEに送らない
    - name: "第七中学校"
      room_id: 146          # テニスコート(予約サイトの施設42・部屋146)
      notify_min_days: 3    # 予約は3日後から。これより近い日の空きはLINEに送らない
    - name: "大沢総合グラウンド"
      room_id: 24
      exclude_courts: [6]   # 監視しないコート番号
    - name: "新川テニスコート"
      room_id: 37
      exclude_courts: [4]   # クレー4面のうち4番は監視しない
    - name: "大沢野川グラウンド"
      room_id: 34           # テニスコート(予約サイトの施設4・部屋34)
  weekdays: [月, 火, 水, 木, 金, 土, 日]   # 監視する曜日
  exclude_holidays: false   # 祝日を除くか
  time_from: "18:00"   # この時刻以降に始まる枠だけ
  days_ahead: 30   # 今日から何日先まで
  date_from: ""   # この日より前は無視(不要なら空欄)

# ===== 都立公園 =====
toei:
  enabled: false
  # bld / inst はコートチェッカーと同じ施設コード
  facilities:
    - name: "祖師谷公園"
      bld: "1070"
      inst: "10700010"
    - name: "高井戸公園"
      bld: "1180"
      inst: "11800030"
    - name: "小金井公園"
      bld: "1240"
      inst: "12400020"
    - name: "野川公園"
      bld: "1260"
      inst: "12600010"
    - name: "府中の森公園"
      bld: "1270"
      inst: "12700020"
  weekdays: [土, 日]   # 監視する曜日
  exclude_holidays: false   # 祝日を除くか
  time_from: "09:00"   # この時刻以降に始まる枠だけ
  days_ahead: 30   # 今日から何日先まで
  date_from: ""   # この日より前は無視(不要なら空欄)

