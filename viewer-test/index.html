<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>閲覧テスト</title>
<style>
body{font-family:sans-serif;margin:16px;max-width:720px;color:#222}
input,button{font-size:16px;padding:8px;max-width:100%}
input[size]{width:100%}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f3f3f3;padding:8px;border-radius:6px;overflow:auto}
.note{font-size:12px;color:#666}
</style></head><body>
<h3>閲覧テスト(GitHub Pages から GAS を呼ぶ)</h3>
<p><input id="url" placeholder="GAS の /exec の URL"></p>
<p><input id="pw" type="password" placeholder="合言葉"> <button id="go">取得</button></p>
<p class="note">合言葉はこの端末の中でハッシュ化してから送ります(合言葉そのものは送りません)。</p>
<div id="out"></div>
<script>
var urlEl = document.getElementById('url');
var pwEl = document.getElementById('pw');
var outEl = document.getElementById('out');
try { var saved = localStorage.getItem('viewtest_url'); if (saved) urlEl.value = saved; } catch (e) {}

function sha256(t){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function(d){
    return Array.prototype.map.call(new Uint8Array(d), function(b){ return b.toString(16).padStart(2, '0'); }).join('');
  });
}

document.getElementById('go').onclick = function(){
  var url = urlEl.value.trim();
  try { localStorage.setItem('viewtest_url', url); } catch (e) {}
  outEl.textContent = '取得中…';
  var t0 = performance.now();
  sha256(pwEl.value).then(function(h){
    // text/plain で送ると、ブラウザが事前の確認(CORS の preflight)をしないで済む
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'view', hash: h }),
      redirect: 'follow'
    });
  }).then(function(res){
    return res.text().then(function(txt){
      var ms = Math.round(performance.now() - t0);
      outEl.innerHTML = '<p>応答 ' + res.status + ' / ' + ms + 'ms</p><pre id="body"></pre>';
      document.getElementById('body').textContent = txt.slice(0, 4000);
    });
  }).catch(function(e){
    outEl.textContent = '失敗: ' + e + '(読めない場合は、ブラウザの制限かURLの違いの可能性があります)';
  });
};
</script></body></html>
